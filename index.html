<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Caderno de Dev</title>
  <meta name="description" content="Um livro vivo sobre C#, .NET e tudo que aparece no caminho.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
  <link rel="stylesheet" href="assets/estilo.css">
  <script>
    // Aplica o tema antes de desenhar a página, pra não piscar.
    try { const t = localStorage.getItem('tema'); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>

  <header class="barra-mobile">
    <button class="botao-menu" type="button" aria-controls="lateral" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      Sumário
    </button>
    <a class="marca-mobile" href="#/"></a>
  </header>

  <aside id="lateral" class="lateral">
    <a class="marca" href="#/">
      <span class="marca-titulo"></span>
      <span class="marca-subtitulo"></span>
    </a>
    <label class="busca">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" placeholder="Buscar capítulo ou tag" aria-label="Buscar capítulo ou tag">
    </label>
    <nav class="sumario" aria-label="Sumário"></nav>
    <div class="rodape-lateral">
      <button class="botao-tema" type="button" aria-label="Alternar tema claro e escuro">
        <svg class="icone-sol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icone-lua" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <span>Tema</span>
      </button>
      <a class="link-repo" hidden target="_blank" rel="noopener">GitHub</a>
    </div>
  </aside>
  <div class="cortina" hidden></div>

  <main id="conteudo" class="conteudo" tabindex="-1">
    <article class="artigo">
      <p class="carregando">Carregando…</p>
    </article>
    <nav class="navegacao-capitulos" aria-label="Capítulo anterior e próximo"></nav>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
